name: Build game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          tail -n 80 build.log
          exit $status

      - name: Run browser smoke test
        run: npm run test:e2e

      - name: Upload Boxing Glove previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxing-glove-v15-preview
          path: |
            test-results/boxing-glove-v15-armed.png
            test-results/boxing-glove-v15-impulse.png
            test-results/boxing-glove-v15-settled.png
          if-no-files-found: warn
          retention-days: 3

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3
