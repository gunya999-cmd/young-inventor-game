name: Build game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Blender for original Jack visual gate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender >/dev/null
          blender --version | head -n 2

      - name: Build original Blender Jack candidate
        env:
          JITB_OUT: test-results/jack-in-the-box-option-a.glb
          JITB_PREVIEW: test-results/jack-option-a-blender.png
        run: |
          mkdir -p test-results
          blender -b --python tools/build-jitb-option-a.py
          test -s test-results/jack-in-the-box-option-a.glb
          test -s test-results/jack-option-a-blender.png

      - name: Validate original Jack geometry
        run: |
          python -m pip install --disable-pip-version-check --quiet trimesh
          python - <<'PY'
          import json, os, trimesh
          path='test-results/jack-in-the-box-option-a.glb'
          scene=trimesh.load(path, force='scene')
          faces=sum(len(g.faces) for g in scene.geometry.values() if hasattr(g,'faces'))
          nodes=set(scene.graph.nodes)
          required={'JITB_Housing','JITB_Lid','JITB_Drive','JITB_Jack','JITB_Spring'}
          report={'bytes':os.path.getsize(path),'triangles':faces,'geometries':len(scene.geometry),'missing':sorted(required-nodes)}
          print(json.dumps(report,indent=2))
          assert 25000 <= faces <= 120000, report
          assert not report['missing'], report
          with open('test-results/jack-option-a-report.json','w') as f: json.dump(report,f,indent=2)
          PY

      - name: Build production bundle
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          tail -n 80 build.log
          exit $status

      - name: Run browser smoke test
        run: npm run test:e2e

      - name: Upload original Jack visual gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jack-option-a-visual-gate
          path: |
            test-results/jack-option-a-blender.png
            test-results/jack-option-a-report.json
            test-results/jack-in-the-box-option-a.glb
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Boxing Glove previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxing-glove-v16-preview
          path: |
            test-results/boxing-glove-v16-armed.png
            test-results/boxing-glove-v16-impulse.png
            test-results/boxing-glove-v16-settled.png
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Trampoline previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trampoline-v3-preview
          path: |
            test-results/trampoline-v3-ready.png
            test-results/trampoline-v3-compressed.png
            test-results/trampoline-v3-bounced.png
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Jack GLB previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jack-in-the-box-v3-glb-preview
          path: |
            test-results/jack-in-the-box-v3-glb-ready.png
            test-results/jack-in-the-box-v3-glb-released.png
          if-no-files-found: warn
          retention-days: 3

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3
