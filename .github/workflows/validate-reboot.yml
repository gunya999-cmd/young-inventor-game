name: Validate clean reboot

on:
  push:
    branches: ['reboot/cleanroom-zero-v2']
  pull_request:
    branches: [main]
    paths:
      - 'src/reboot/**'
      - 'src/main.ts'
      - 'index.html'
      - 'package.json'
      - 'e2e/reboot-stage-01.spec.ts'
      - '.github/workflows/validate-reboot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Production build and unit physics
        run: npm run build
      - name: Browser Level 1 regression
        run: npx playwright test e2e/reboot-stage-01.spec.ts --workers=1 --timeout=45000
