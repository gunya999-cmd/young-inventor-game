name: Inspect real Jack high-poly source

on:
  push:
    branches:
      - agent/parts-09-13-open-assets
    paths:
      - .github/workflows/research-jitb-open-source.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Objaverse inspection tools
        run: python -m pip install --disable-pip-version-check --quiet objaverse trimesh pillow

      - name: Download and compare CC-BY source GLBs
        run: |
          mkdir -p test-results/jitb-candidates
          python - <<'PY'
          import json, os, shutil, struct
          import objaverse
          import trimesh

          candidates = {
              'evan-cg': '8c96dd839bc14a289a3c857a9a41ba0b',
              'burntclowns': 'e4963a7d83604a0ebc71af61460ef327',
              'tesni-evans': 'fc0b76b3381246298c5a75bb79b69c19',
              'vasian-digital3d': '32702a813df8489aad2a54be7eb5f86a',
          }

          def glb_json(path):
              with open(path, 'rb') as f:
                  magic, version, length = struct.unpack('<4sII', f.read(12))
                  if magic != b'glTF' or version != 2:
                      raise RuntimeError(f'Not GLB2: {path}')
                  chunk_len, chunk_type = struct.unpack('<I4s', f.read(8))
                  if chunk_type != b'JSON':
                      raise RuntimeError(f'First GLB chunk not JSON: {path}')
                  return json.loads(f.read(chunk_len).decode('utf-8').rstrip('\x00 '))

          uids = list(candidates.values())
          annotations = objaverse.load_annotations(uids)
          objects = objaverse.load_objects(uids, download_processes=4)
          all_reports = {}

          for slug, uid in candidates.items():
              annotation = annotations.get(uid)
              source = objects.get(uid)
              if not annotation or not source or not os.path.exists(source):
                  all_reports[slug] = {'uid': uid, 'error': 'metadata-or-object-missing'}
                  continue

              license_value = str(annotation.get('license', '')).lower()
              if 'by' not in license_value and 'attribution' not in license_value:
                  all_reports[slug] = {'uid': uid, 'error': f'license:{annotation.get("license")}' }
                  continue

              target = f'test-results/jitb-candidates/{slug}-{uid}.glb'
              shutil.copy2(source, target)
              scene = trimesh.load(target, force='scene')
              doc = glb_json(target)
              faces = sum(len(g.faces) for g in scene.geometry.values() if hasattr(g, 'faces'))
              vertices = sum(len(g.vertices) for g in scene.geometry.values() if hasattr(g, 'vertices'))
              materials = doc.get('materials', [])
              textures = doc.get('textures', [])
              images = doc.get('images', [])
              normal_maps = sum(1 for m in materials if m.get('normalTexture'))
              occlusion_maps = sum(1 for m in materials if m.get('occlusionTexture'))
              emissive_maps = sum(1 for m in materials if m.get('emissiveTexture'))
              base_color_maps = sum(1 for m in materials if m.get('pbrMetallicRoughness', {}).get('baseColorTexture'))
              metallic_roughness_maps = sum(1 for m in materials if m.get('pbrMetallicRoughness', {}).get('metallicRoughnessTexture'))
              image_bytes = []
              for image in images:
                  view_index = image.get('bufferView')
                  if isinstance(view_index, int) and view_index < len(doc.get('bufferViews', [])):
                      image_bytes.append(doc['bufferViews'][view_index].get('byteLength', 0))
              report = {
                  'uid': uid,
                  'name': annotation.get('name'),
                  'license': annotation.get('license'),
                  'uri': annotation.get('uri'),
                  'bytes': os.path.getsize(target),
                  'faces': faces,
                  'vertices': vertices,
                  'geometry_count': len(scene.geometry),
                  'node_count': len(scene.graph.nodes),
                  'material_count': len(materials),
                  'texture_count': len(textures),
                  'image_count': len(images),
                  'embedded_image_bytes': sum(image_bytes),
                  'base_color_maps': base_color_maps,
                  'normal_maps': normal_maps,
                  'metallic_roughness_maps': metallic_roughness_maps,
                  'occlusion_maps': occlusion_maps,
                  'emissive_maps': emissive_maps,
                  'geometry_names': list(scene.geometry.keys())[:100],
                  'node_names': list(scene.graph.nodes)[:150],
                  'bounds': scene.bounds.tolist() if scene.bounds is not None else None,
              }
              # A deliberately simple source-quality score: real texture maps matter more than raw triangles.
              report['source_score'] = (
                  image_count * 25 + normal_maps * 30 + base_color_maps * 18 +
                  metallic_roughness_maps * 25 + occlusion_maps * 8 +
                  min(20, geometry_count) + min(20, faces / 25000)
              ) if (image_count := len(images)) >= 0 else 0
              all_reports[slug] = report
              print('CANDIDATE_REPORT', slug)
              print(json.dumps(report, indent=2, ensure_ascii=False, default=str))

          ranked = sorted(
              ((slug, r) for slug, r in all_reports.items() if 'error' not in r),
              key=lambda item: item[1].get('source_score', 0), reverse=True
          )
          summary = {
              'ranked': [slug for slug, _ in ranked],
              'reports': all_reports,
          }
          print('COMPARISON_SUMMARY')
          print(json.dumps(summary, indent=2, ensure_ascii=False, default=str))
          with open('test-results/jitb-candidates/comparison.json', 'w', encoding='utf-8') as f:
              json.dump(summary, f, ensure_ascii=False, indent=2, default=str)
          if not ranked:
              raise RuntimeError('No usable CC-BY candidates downloaded')
          PY

      - name: Upload inspected candidates
        uses: actions/upload-artifact@v4
        with:
          name: jitb-real-source-candidates
          path: test-results/jitb-candidates
          retention-days: 3
