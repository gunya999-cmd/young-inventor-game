name: Inspect real Jack high-poly source

on:
  push:
    branches:
      - agent/parts-09-13-open-assets
    paths:
      - .github/workflows/research-jitb-open-source.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Objaverse inspection tools
        run: python -m pip install --disable-pip-version-check --quiet objaverse trimesh pillow

      - name: Download and inspect CC-BY source GLB
        run: |
          mkdir -p test-results/jitb-source
          python - <<'PY'
          import json, os, shutil
          import objaverse
          import trimesh

          uid = '8c96dd839bc14a289a3c857a9a41ba0b'
          annotations = objaverse.load_annotations([uid])
          annotation = annotations.get(uid)
          if not annotation:
              raise RuntimeError(f'Objaverse metadata missing UID {uid}')

          print('ANNOTATION_START')
          print(json.dumps({
              'uid': uid,
              'name': annotation.get('name'),
              'uri': annotation.get('uri'),
              'license': annotation.get('license'),
              'categories': annotation.get('categories'),
              'tags': annotation.get('tags'),
          }, ensure_ascii=False, indent=2, default=str))
          print('ANNOTATION_END')

          license_value = str(annotation.get('license', '')).lower()
          if 'by' not in license_value and 'attribution' not in license_value:
              raise RuntimeError(f'Unexpected license: {annotation.get("license")}')

          objects = objaverse.load_objects([uid], download_processes=1, download_dir='/tmp/objaverse')
          source = objects.get(uid)
          if not source or not os.path.exists(source):
              raise RuntimeError('Objaverse did not materialize the requested GLB')

          target = 'test-results/jitb-source/evan-cg-jack-in-the-box-cc-by.glb'
          shutil.copy2(source, target)
          scene = trimesh.load(target, force='scene')
          faces = sum(len(g.faces) for g in scene.geometry.values() if hasattr(g, 'faces'))
          vertices = sum(len(g.vertices) for g in scene.geometry.values() if hasattr(g, 'vertices'))
          report = {
              'bytes': os.path.getsize(target),
              'faces': faces,
              'vertices': vertices,
              'geometry_count': len(scene.geometry),
              'node_count': len(scene.graph.nodes),
              'geometry_names': list(scene.geometry.keys())[:200],
              'node_names': list(scene.graph.nodes)[:300],
              'bounds': scene.bounds.tolist() if scene.bounds is not None else None,
          }
          print('REPORT_START')
          print(json.dumps(report, indent=2, default=str))
          print('REPORT_END')
          with open('test-results/jitb-source/report.json', 'w', encoding='utf-8') as f:
              json.dump({'annotation': annotation, 'report': report}, f, ensure_ascii=False, indent=2, default=str)
          PY

      - name: Upload inspected source
        uses: actions/upload-artifact@v4
        with:
          name: jitb-high-poly-open-source-inspection
          path: test-results/jitb-source
          retention-days: 3
