name: Generate realistic Jack GLB

on:
  push:
    branches:
      - agent/parts-09-13-open-assets
    paths:
      - tools/jitb_generator_v4.py.gz.b64
      - .github/workflows/generate-jitb-glb.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/parts-09-13-open-assets
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mesh exporter
        run: python -m pip install --disable-pip-version-check numpy trimesh

      - name: Decode generator v4
        run: base64 -d tools/jitb_generator_v4.py.gz.b64 | gunzip > /tmp/generate_jitb.py

      - name: Generate game-ready GLB
        env:
          JITB_OUT: public/assets/jack-in-the-box-v3-realistic.glb
        run: python /tmp/generate_jitb.py

      - name: Verify binary asset
        run: |
          test -s public/assets/jack-in-the-box-v3-realistic.glb
          python - <<'PY'
          import os, trimesh
          p = 'public/assets/jack-in-the-box-v3-realistic.glb'
          scene = trimesh.load(p, force='scene')
          faces = sum(len(g.faces) for g in scene.geometry.values() if hasattr(g, 'faces'))
          required = {'JITB_Housing','JITB_Lid','JITB_Drive','JITB_Jack','JITB_Spring'}
          nodes = set(scene.graph.nodes)
          missing = sorted(required - nodes)
          assert faces >= 30000, faces
          assert not missing, missing
          assert os.path.getsize(p) >= 400000, os.path.getsize(p)
          print({'bytes': os.path.getsize(p), 'faces': faces, 'geometries': len(scene.geometry)})
          PY

      - name: Commit generated GLB
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/jack-in-the-box-v3-realistic.glb
          if git diff --cached --quiet; then
            echo 'GLB already current.'
            exit 0
          fi
          git commit -m 'Refine realistic Jack GLB v4 [skip glb-gen]'
          git pull --rebase origin agent/parts-09-13-open-assets
          git push origin HEAD:agent/parts-09-13-open-assets
