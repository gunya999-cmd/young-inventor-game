name: Validate campaign stage 01

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/campaignStage01.ts'
      - 'src/campaignStage01.css'
      - 'src/campaignStage01Physics.ts'
      - 'src/campaignStage01Physics.test.ts'
      - 'src/campaignStage01Definition.ts'
      - 'src/campaignStage01Definition.test.ts'
      - 'src/mechanicsCatalog.ts'
      - 'src/workshopAssetKit.ts'
      - 'src/main.ts'
      - 'e2e/campaign-stage-01.spec.ts'
      - '.github/workflows/validate-campaign-stage-01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campaign-stage-01:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Verify first campaign stage
        run: npx playwright test e2e/campaign-stage-01.spec.ts --workers=1 --timeout=45000
