name: One-shot Jack drive tuning

on:
  push:
    branches:
      - agent/parts-09-13-open-assets
    paths:
      - .github/workflows/one-shot-jitb-physics-tune.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parts-09-13-open-assets
          fetch-depth: 0
      - name: Increase one-click physical drive impulse
        run: |
          python - <<'PY'
          p='src/jackInTheBoxV1.ts'
          text=open(p,encoding='utf-8').read()
          old='const DRIVE_IMPULSE = 0.24;'
          new='const DRIVE_IMPULSE = 0.32;'
          if old not in text:
              raise SystemExit('Expected Jack impulse marker not found')
          open(p,'w',encoding='utf-8').write(text.replace(old,new,1))
          PY
          git diff -- src/jackInTheBoxV1.ts
      - name: Commit tuning
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/jackInTheBoxV1.ts
          git commit -m 'Tune Jack drive impulse for reliable latch release'
          git pull --rebase origin agent/parts-09-13-open-assets
          git push origin HEAD:agent/parts-09-13-open-assets
