name: One-shot Jack latch tune

on:
  push:
    branches:
      - agent/parts-09-13-open-assets
    paths:
      - .github/workflows/one-shot-jitb-threshold.yml

permissions:
  contents: write

jobs:
  tune-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parts-09-13-open-assets
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Tune physical latch threshold
        run: |
          python - <<'PY'
          p='src/jackInTheBoxV1.ts'
          text=open(p,encoding='utf-8').read()
          old='const DRIVE_THRESHOLD = 4.25;'
          new='const DRIVE_THRESHOLD = 4.0;'
          if old not in text:
              raise SystemExit('Expected 4.25 Jack latch threshold not found')
          open(p,'w',encoding='utf-8').write(text.replace(old,new,1))
          PY
          grep 'DRIVE_THRESHOLD' src/jackInTheBoxV1.ts | head -n 1

      - name: Install focused test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run focused Jack browser test
        run: npx playwright test e2e/jack-in-the-box.spec.ts --workers=1

      - name: Commit verified threshold and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-jitb-threshold.yml
          git add src/jackInTheBoxV1.ts
          git commit -m 'Tune Jack latch threshold after focused physics verification'
          git pull --rebase origin agent/parts-09-13-open-assets
          git push origin HEAD:agent/parts-09-13-open-assets
