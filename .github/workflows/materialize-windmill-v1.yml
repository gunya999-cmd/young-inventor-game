name: Materialize Windmill v1 GLB

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-windmill-v1.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Install Blender and texture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy libegl1 libgl1 libglx-mesa0 libopengl0 >/dev/null
          python -m pip install --disable-pip-version-check --quiet pillow numpy

      - name: Build reviewed original Windmill GLB
        env:
          WINDMILL_OUT: public/assets/windmill-v1.glb
          WINDMILL_PREVIEW: test-results/windmill-v1-materialized.png
        run: |
          mkdir -p public/assets test-results
          python tools/generate-windmill-v1-textures.py
          blender -b --python tools/build-windmill-v1.py
          test -s public/assets/windmill-v1.glb
          ls -lh public/assets/windmill-v1.glb

      - name: Commit binary game asset to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/windmill-v1.glb
          if git diff --cached --quiet; then
            echo 'Windmill GLB already materialized.'
            exit 0
          fi
          git commit -m 'Add reviewed original Windmill v1 GLB'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
