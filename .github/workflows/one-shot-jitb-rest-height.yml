name: One-shot Jack spring equilibrium

on:
  push:
    branches:
      - agent/parts-09-13-open-assets
    paths:
      - .github/workflows/one-shot-jitb-rest-height.yml

permissions:
  contents: write

jobs:
  tune-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parts-09-13-open-assets
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Set physical extended equilibrium
        run: |
          python - <<'PY'
          p='src/jackInTheBoxV1.ts'
          text=open(p,encoding='utf-8').read()
          old='const JACK_REST_Y = 0.68;'
          new='const JACK_REST_Y = 0.88;'
          if old not in text:
              raise SystemExit('Expected Jack rest-height marker not found')
          open(p,'w',encoding='utf-8').write(text.replace(old,new,1))

          p='e2e/jack-in-the-box.spec.ts'
          text=open(p,encoding='utf-8').read()
          old=".toBeGreaterThan(0.20);\n  await page.screenshot({ path: 'test-results/jack-in-the-box-v5-original-released.png'"
          new=".toBeGreaterThan(0.50);\n  await page.screenshot({ path: 'test-results/jack-in-the-box-v5-original-released.png'"
          if old not in text:
              raise SystemExit('Expected Jack screenshot-height marker not found')
          open(p,'w',encoding='utf-8').write(text.replace(old,new,1))
          PY
          grep 'JACK_REST_Y' src/jackInTheBoxV1.ts | head -n 1
          grep -A2 'actual emerging pose' e2e/jack-in-the-box.spec.ts

      - name: Install focused test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run focused Jack browser test
        run: npx playwright test e2e/jack-in-the-box.spec.ts --workers=1

      - name: Commit verified spring equilibrium
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/jackInTheBoxV1.ts e2e/jack-in-the-box.spec.ts
          git commit -m 'Keep Jack visibly extended after physical release'
          git pull --rebase origin agent/parts-09-13-open-assets
          git push origin HEAD:agent/parts-09-13-open-assets
