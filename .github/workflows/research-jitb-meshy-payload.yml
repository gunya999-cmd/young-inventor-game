name: Inspect actual Meshy Jack payload

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download actual public model payload
        env:
          MODEL_URL: https://www.meshy.ai/3d-models/An-old-rusted-jackinthebox-its-tin-body-dented-and-covered-in-peeling-circus-designs-The-handle-grinds-loudly-when-turned-playing-a-distorted-lullaby-When-it-pops-open-a-grotesque-puppet-with-oversized-eyes-and-an-impossibly-wide-grin-springs-out-its-fabriccovered-hands-reaching-forward-unnaturally-Its-head-slowly-tilts-watching-whoever-opened-it-v2-0195a25f-cbd6-78c8-9255-1c8e88a70b80
        run: |
          mkdir -p test-results/meshy-actual
          python - <<'PY'
          import json, os, re, urllib.request, urllib.parse, pathlib
          out=pathlib.Path('test-results/meshy-actual')
          headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
          def get(url, timeout=90, extra=None):
              h=dict(headers); h.update(extra or {})
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.status,dict(r.headers),r.read(),r.geturl()
          status,hs,body,final=get(os.environ['MODEL_URL'],45)
          text=body.decode('utf-8','replace')
          normalized=text.replace('\\u0026','&').replace('\\/','/').replace('\\"','"')
          def field(name):
              m=re.search(r'"'+re.escape(name)+r'":"([^"]+)"',normalized)
              return m.group(1) if m else None
          licenses=re.findall(r'"license":"([^"]+)"',normalized)
          model_url=field('modelUrl'); quad_url=field('quadJsonUrl'); color_url=field('colorMapUrl')
          tri=re.search(r'"triangleCount":(\d+)',normalized); verts=re.search(r'"vertexCount":(\d+)',normalized)
          pbr=re.search(r'"isGeneratePBRMaps":(true|false)',normalized)
          meta={'licenses':sorted(set(licenses)),'model_url':model_url,'quad_json_url':quad_url,'color_map_url':color_url,
                'triangle_count':int(tri.group(1)) if tri else None,'vertex_count':int(verts.group(1)) if verts else None,
                'is_generate_pbr_maps':pbr.group(1)=='true' if pbr else None}
          print('META',json.dumps(meta,indent=2))
          if 'cc0' not in licenses: raise RuntimeError(f'Model CC0 marker missing: {licenses[:20]}')
          if not all([model_url,quad_url,color_url]): raise RuntimeError('Viewer URLs missing')
          downloads={}
          for key,url,name in [('model',model_url,'model.meshy'),('quad',quad_url,'model.json'),('color',color_url,'texture_0.png')]:
              st,h,data,fu=get(url)
              (out/name).write_bytes(data)
              downloads[key]={'status':st,'bytes':len(data),'content_type':h.get('Content-Type'),'first64_hex':data[:64].hex(),'final_url':fu}
              print('DOWNLOAD',key,json.dumps(downloads[key],indent=2))
          raw=(out/'model.meshy').read_bytes()
          fmt='glb' if raw.startswith(b'glTF') else 'zip' if raw.startswith(b'PK\x03\x04') else 'json' if raw[:1] in (b'{',b'[') else 'ply' if raw.startswith(b'ply') else 'unknown'
          downloads['model']['detected_format']=fmt
          print('MODEL_FORMAT',fmt,'magic',raw[:32].hex())
          # model.json structural inspection
          qraw=(out/'model.json').read_bytes()
          try:
              q=json.loads(qraw.decode('utf-8'))
              print('MODEL_JSON_TYPE',type(q).__name__)
              if isinstance(q,dict):
                  print('MODEL_JSON_KEYS',list(q.keys())[:100])
                  for k,v in q.items():
                      if isinstance(v,(list,dict,str)):
                          try: n=len(v)
                          except: n=None
                          print('FIELD',k,'type',type(v).__name__,'len',n)
              (out/'model-json-pretty.json').write_text(json.dumps(q,indent=2)[:2000000],encoding='utf-8')
          except Exception as e:
              print('MODEL_JSON_PARSE_ERROR',repr(e))
          # Probe sibling export names with and without original signature.
          parsed=urllib.parse.urlparse(model_url); base=parsed.path.rsplit('/',1)[0]
          probes={}
          for name in ['model.glb','model.gltf','model.obj','model.fbx','model.stl']:
              for signed in [True,False]:
                  u=urllib.parse.urlunparse((parsed.scheme,parsed.netloc,base+'/'+name,'',parsed.query if signed else '',''))
                  label=name+(':signed' if signed else ':unsigned')
                  try:
                      st,h,data,fu=get(u,20,{'Range':'bytes=0-127'})
                      probes[label]={'status':st,'bytes_read':len(data),'content_type':h.get('Content-Type'),'content_length':h.get('Content-Length'),'content_range':h.get('Content-Range'),'first32_hex':data[:32].hex()}
                  except Exception as e:
                      probes[label]={'error':str(e)[:250]}
          print('PROBES',json.dumps(probes,indent=2))
          (out/'report.json').write_text(json.dumps({'meta':meta,'downloads':downloads,'probes':probes},indent=2),encoding='utf-8')
          PY

      - name: Upload actual payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshy-cc0-jack-actual-payload
          path: test-results/meshy-actual
          retention-days: 3
