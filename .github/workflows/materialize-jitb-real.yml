name: Materialize real CC0 Jack GLB

on:
  push:
    branches:
      - agent/parts-09-13-open-assets
    paths:
      - .github/workflows/materialize-jitb-real.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout asset branch
        uses: actions/checkout@v4
        with:
          ref: agent/parts-09-13-open-assets
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install crypto dependency
        run: python -m pip install --disable-pip-version-check --quiet cryptography

      - name: Download, decrypt and validate CC0 Meshy source
        env:
          MODEL_PAGE: https://www.meshy.ai/3d-models/An-old-rusted-jackinthebox-its-tin-body-dented-and-covered-in-peeling-circus-designs-The-handle-grinds-loudly-when-turned-playing-a-distorted-lullaby-When-it-pops-open-a-grotesque-puppet-with-oversized-eyes-and-an-impossibly-wide-grin-springs-out-its-fabriccovered-hands-reaching-forward-unnaturally-Its-head-slowly-tilts-watching-whoever-opened-it-v2-0195a25f-cbd6-78c8-9255-1c8e88a70b80
        run: |
          mkdir -p public/assets
          python - <<'PY'
          import json, os, re, struct, urllib.request
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes

          page_url = os.environ['MODEL_PAGE']
          headers = {'User-Agent':'Mozilla/5.0','Accept':'*/*'}
          req = urllib.request.Request(page_url, headers=headers)
          with urllib.request.urlopen(req, timeout=45) as response:
              html = response.read().decode('utf-8', 'replace')
          normalized = html.replace('\\u0026','&').replace('\\/','/').replace('\\"','"')

          licenses = sorted(set(re.findall(r'"license":"([^"]+)"', normalized)))
          if not any(v.lower() == 'cc0' or 'creativecommons.org/publicdomain/zero' in v.lower() for v in licenses):
              raise RuntimeError(f'CC0 marker missing from source page: {licenses[:30]}')

          def field(name):
              m = re.search(r'"' + re.escape(name) + r'":"([^"]+)"', normalized)
              return m.group(1) if m else None

          model_url = field('modelUrl')
          tri = re.search(r'"triangleCount":(\d+)', normalized)
          verts = re.search(r'"vertexCount":(\d+)', normalized)
          if not model_url:
              raise RuntimeError('Public modelUrl missing')

          req = urllib.request.Request(model_url, headers=headers)
          with urllib.request.urlopen(req, timeout=90) as response:
              meshy = response.read()
          if meshy[:8] != b'MESHY.AI':
              raise RuntimeError(f'Unexpected Meshy magic: {meshy[:16]!r}')

          nonce = meshy[10:22]
          body = meshy[32:]
          encrypted = body[:8192]
          plaintext_tail = body[8208:]
          key = b'JSON{"accessors":[{"bufferView":'
          counter = nonce + (2).to_bytes(4, 'big')
          decryptor = Cipher(algorithms.AES(key), modes.CTR(counter)).decryptor()
          prefix = decryptor.update(encrypted) + decryptor.finalize()
          glb = bytearray(prefix + plaintext_tail)
          if glb[:4] != b'glTF':
              raise RuntimeError('Decrypted source is not GLB')
          struct.pack_into('<I', glb, 8, len(glb))

          json_len = struct.unpack_from('<I', glb, 12)[0]
          doc = json.loads(bytes(glb[20:20+json_len]).decode('utf-8').rstrip(' \x00'))
          required = set(doc.get('extensionsRequired', []))
          if 'EXT_meshopt_compression' not in required:
              raise RuntimeError(f'Expected meshopt-compressed GLB, got {sorted(required)}')
          if len(doc.get('meshes', [])) < 1 or len(doc.get('materials', [])) < 1 or len(doc.get('textures', [])) < 1:
              raise RuntimeError('Decoded GLB is missing mesh/material/texture data')

          target = Path('public/assets/jack-in-the-box-real-cc0.glb')
          target.write_bytes(glb)
          metadata = {
              'sourcePage': page_url,
              'license': 'CC0-1.0',
              'sourceTriangleCount': int(tri.group(1)) if tri else None,
              'sourceVertexCount': int(verts.group(1)) if verts else None,
              'glbBytes': len(glb),
              'generator': doc.get('asset', {}).get('generator'),
              'extensionsRequired': doc.get('extensionsRequired', []),
              'meshes': len(doc.get('meshes', [])),
              'materials': len(doc.get('materials', [])),
              'textures': len(doc.get('textures', [])),
              'images': len(doc.get('images', [])),
              'note': 'Real source mesh from public CC0 Meshy model; .meshy wrapper decrypted to its embedded GLB without re-authoring geometry.'
          }
          Path('public/assets/jack-in-the-box-real-cc0.source.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          print(json.dumps(metadata, indent=2))
          PY

      - name: Commit real GLB to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/jack-in-the-box-real-cc0.glb public/assets/jack-in-the-box-real-cc0.source.json
          if git diff --cached --quiet; then
            echo "Real CC0 GLB is already materialized."
            exit 0
          fi
          git commit -m "Add real CC0 Jack-in-the-Box GLB"
          git push origin HEAD:agent/parts-09-13-open-assets
