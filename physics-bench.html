<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics Calibration Bench</title>
    <style>
      :root{font-family:Inter,system-ui,sans-serif;color:#17212a;background:#edf0f2}*{box-sizing:border-box}body{margin:0}.bench{max-width:1440px;margin:auto;padding:24px}.top{display:flex;gap:20px;align-items:center;justify-content:space-between;margin-bottom:20px}.top h1{margin:0;font-size:26px}.top p{margin:5px 0 0;color:#60707d}.controls{display:flex;gap:8px}.controls button{border:1px solid #b8c1c8;background:white;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer}.controls .run{background:#193f59;color:white;border-color:#193f59}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid #ccd3d8;border-radius:14px;overflow:hidden;box-shadow:0 5px 18px rgba(30,45,55,.08)}.card header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #e0e5e8}.card h2{font-size:15px;margin:0}.status{font-size:11px;font-weight:900;color:#16804a;background:#e7f6ed;padding:4px 7px;border-radius:999px}.stage{background:#f7f6f1;padding:8px}.stage canvas{display:block;width:100%;aspect-ratio:16/7;background:#f1eee4;border:1px solid #ddd7c8;border-radius:8px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#e8ecee}.metric{background:#fff;padding:9px 12px}.metric small{display:block;color:#7a8790;font-size:10px;text-transform:uppercase;letter-spacing:.07em}.metric b{font-size:13px}.note{padding:9px 14px;color:#65737c;font-size:12px}.footer{margin-top:16px;color:#697780;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
    </style>
  </head>
  <body>
    <main class="bench">
      <div class="top"><div><h1>Physics Calibration Bench</h1><p>Изолированная проверка Box2D · фиксированный шаг 120 Hz · без игрового уровня и редактора</p></div><div class="controls"><button id="reset">Сбросить</button><button id="toggle" class="run">Ⅱ Пауза</button></div></div>
      <section id="bench-grid" class="grid"></section>
      <div class="footer">Эта страница диагностическая. Она нужна для настройки механики до подключения финальной графики.</div>
    </main>
    <script type="module" src="/src/physicsBench.ts"></script>
  </body>
</html>
